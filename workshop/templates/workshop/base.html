{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Главная{% endblock %} · Велоцех</title>
  <link rel="stylesheet" href="{% static 'workshop/style.css' %}">
</head>
<body>
<header class="header">
  <div class="wrap bar">
    <a class="brand" href="{% url 'workshop:home' %}"><span>↗</span> ВЕЛОЦЕХ</a>
    {% with page=request.resolver_match.url_name %}
    <nav aria-label="Главная навигация">
      <a href="{% url 'workshop:home' %}" {% if page == 'home' %}aria-current="page"{% endif %}>Главная</a>
      <div class="company">
        <a href="{% url 'workshop:about' %}" {% if page == 'about' %}aria-current="page"{% endif %}>О компании</a>
        <details>
          <summary aria-label="Страницы о компании">▾</summary>
          <div class="submenu">
            <a href="{% url 'workshop:contacts' %}" {% if page == 'contacts' %}aria-current="page"{% endif %}>Контакты</a>
            <a href="{% url 'workshop:directions' %}" {% if page == 'directions' %}aria-current="page"{% endif %}>Как нас найти</a>
          </div>
        </details>
      </div>
      <a href="{% url 'workshop:services' %}" {% if page == 'services' %}aria-current="page"{% endif %}>Услуги</a>
      <a href="{% url 'workshop:prices' %}" {% if page == 'prices' %}aria-current="page"{% endif %}>Цены</a>
    </nav>
    {% endwith %}
  </div>
</header>
<main class="wrap">{% block content %}{% endblock %}</main>
<footer class="wrap footer"><strong>↗ ВЕЛОЦЕХ</strong><span>Учебный проект · Веломастерская</span></footer>
</body>
</html>
